name: CI

# Bonus-CI: reiner Komfort, blockiert nichts. Läuft nur
# Unit-Tests (kein `pytest -m integration`, das braucht eine lokale PostGIS-
# Instanz; `-m netcheck` fragt echte Endpunkte ab und ist per addopts in
# pyproject.toml ausgeschlossen) und den Frontend-Build/Typecheck.

on:
  push:
  pull_request:

jobs:
  python:
    name: Python (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: uv installieren
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Python-Version festlegen
        run: uv python install 3.11

      - name: Abhaengigkeiten installieren
        run: uv sync --all-extras --dev

      - name: Unit-Tests
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check src tests

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
