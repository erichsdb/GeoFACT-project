  green_tags:
    type: list
    items: mapping
    description: "OSM-Tag-Sets, die als grün zählen (mittlere Definition: Parks, Wald, Gras, Gebüsch)"
    default:
      - { leisure: park }
      - { leisure: garden }
      - { landuse: recreation_ground }
      - { landuse: village_green }
      - { landuse: forest }
      - { natural: wood }
      - { landuse: grass }
      - { natural: grassland }
      - { natural: scrub }
      - { natural: heath }
  top:
    type: integer
    default: 10
    description: Länge der Rangliste
  with_map:
    type: boolean
    default: true
    description: Karte der Rangliste schreiben

modules:
  stadt_gruen:
    description: Stadtgrenze, grüne Flächen und Grünanteil einer Stadt
    args:
      region: { type: string, description: Nominatim-Name der Stadtgrenze }
    layers:
      - id: grenze
        source: region
        region: "${region}"
      - id: gruen
        source: osm
        region: "${region}"
        tags: "${green_tags}"
        geometry: polygon
        columns: [name, leisure, landuse, natural]
    steps:
      - id: anteil
        op: area_share
        inputs: { zones: grenze, features: gruen }
        params: { output_field: gruenanteil, absolute_field: gruen_m2, decimals: 4 }
    exports: [anteil]

scenario:
  name: "Grünste Großstadt Deutschlands (OpenStreetMap)"
  description: "Anteil der Stadtfläche unter Parks, Wald, Gras und Gebüsch je Großstadt, als Rangliste"
  region: "Deutschland"
  crs: "EPSG:25832"

instances:
  - id: stadt
    module: stadt_gruen
    foreach: { var: c, in: "${cities}" }
    key: "${c.id}"
    with: { region: "${c.region}" }

steps:
  - id: alle_staedte
    op: collect
    inputs: "stadt[*].anteil"
    params: { source_field: stadt_id }

  - id: rangliste
    op: top_n
    inputs: { features: alle_staedte }
    params: { by: gruenanteil, n: "${top}", rank_field: rang }

output:
  - type: csv
    source: alle_staedte
    path: "gruenanteil_grossstaedte.csv"
  - type: csv
    source: rangliste
    path: "rangliste_gruenste_grossstaedte.csv"
  - type: geojson
    source: rangliste
    path: "rangliste_gruenste_grossstaedte.geojson"
  - type: map
    when: "${with_map}"
    source: rangliste
    path: "rangliste_gruenste_grossstaedte.html"
    color_field: gruenanteil
    normalize_by_area: false
