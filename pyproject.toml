[project]
name = "geofact"
version = "0.1.0"
description = "Deklaratives, YAML-konfigurierbares Framework zur Analyse offener Geodaten"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "geopandas",
    "shapely",
    "pyproj",
    "rasterio",
    "affine",
    "networkx",
    "folium",
    "rdflib",
    "requests",
    "psycopg[binary]",
    "sqlalchemy",
    # war bereits transitiv ueber geopandas vorhanden (geopandas' I/O-
    # Engine: "pyogrio 0.13.0, kein fiona") -
    # jetzt auch direkt importiert (builtin/formats/vector.py: list_layers()
    # fuer die GeoPackage-Mehrschicht-Erkennung, FA4) und deshalb explizit
    # deklariert statt implizit ueber geopandas mitgezogen
    "pyogrio",
    # pandas' read_excel-Engine fuer .xlsx (FA14: Excel-Arbeitsmappen als
    # Tabellenquelle, builtin/formats/tables.py) - pandas selbst bringt keine
    # Excel-Engine mit, sie muss separat installiert sein
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
# Web-Demo-Backend (FastAPI). Kern (geofact) bleibt ohne diese
# Abhaengigkeiten nutzbar: `uv sync --extra web` installiert sie zusaetzlich.
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pillow>=10",
    "python-dotenv>=1.0",
]

[project.scripts]
geofact = "geofact.cli:main"
geofact-api = "geofact_web.main:run"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geofact", "backend/geofact_web"]
# Paketdaten des Web-Backends: der kuratierte API-Katalog (FA36) wird zur Laufzeit
# mit importlib.resources aus dem Paket gelesen (backend/geofact_web/api_catalog.py).
# 'artifacts' nimmt die Datei ausdruecklich ins Wheel auf, auch wenn eine
# Ignore-Regel sie einmal erfasste; sie liegt im Paket und damit im Docker-Image
# (Dockerfile.backend kopiert backend/ komplett).
artifacts = ["backend/geofact_web/data/*.yaml"]

[tool.pytest.ini_options]
# Der Standardlauf ist offline (FA45): Tests, die echte externe Endpunkte
# abfragen, tragen die Marke netcheck und sind hier ausgeschlossen. Ein
# explizites -m auf der Kommandozeile ersetzt diesen Ausdruck, z. B.
# `pytest -m netcheck` (nur Live-Tests) oder `pytest -m integration`
# (PostGIS, siehe README, Abschnitt Tests).
addopts = "-m 'not netcheck'"
markers = [
    "integration: needs local PostGIS (GEOFACT_PG_DSN)",
    "e2e: end-to-end scenario run",
    "netcheck: queries real external endpoints (Overpass, Nominatim, WFS, ...); excluded from the default run, opt-in with -m netcheck",
]
