  - id: leipzig_opendata
    label: Open Data Portal Leipzig (CKAN)
    provider: Stadt Leipzig
    protocol: ckan
    base_url: https://opendata.leipzig.de
    spec_url: https://opendata.leipzig.de/api/3/action/package_list
    spec_type: ckan_api
    license: je Datensatz unterschiedlich (meist CC-BY oder dl-de/by-2-0)
    documentation_url: https://docs.ckan.org/en/latest/api/
    verified: 2026-09
    description: >-
      Kommunale Fachdaten der Stadt Leipzig (Baumkataster, Spielplaetze,
      Schulen, Ortsteilgrenzen, Kleinraeumige Statistik). Aufloesung von
      Dataset/Resource zu Download-URL uebernimmt der CKAN-Konnektor
      (FA16). Die CKAN-API ist selbstbeschreibend: package_list nennt
      alle Datensaetze, package_show deren Ressourcen.
    endpoints:
      - name: /api/3/action/package_list
        title: Alle Datensatz-Namen
        method: GET
      - name: /api/3/action/package_show
        title: Datensatz-Details inkl. Ressourcen (Parameter id=<name>)
        method: GET
      - name: /api/3/action/resource_search
        title: Ressourcensuche (Parameter query=<feld:wert>)
        method: GET
    example_layer:
      id: leipzig_ortsteile
      source: ckan
      base_url: https://opendata.leipzig.de
      dataset: ortsteile-leipzig
      format: geojson
      data_type: vector

  - id: govdata
    label: GovData - Datenportal fuer Deutschland (CKAN)
    provider: Bundesministerium des Innern / Laender
    protocol: ckan
    base_url: https://www.govdata.de
    spec_url: https://www.govdata.de/ckan/api/3/action/package_list
    spec_type: ckan_api
    license: je Datensatz unterschiedlich
    documentation_url: https://www.govdata.de/api
    verified: 2026-09
    description: >-
      Metadaten-Portal ueber Bund, Laender und Kommunen hinweg - der
      Einstieg, um ueberhaupt zu finden, welche Behoerde einen
      gesuchten Datensatz veroeffentlicht. Liefert selbst keine
      Fachdaten, sondern verweist auf die Quellportale.
    endpoints:
      - name: /ckan/api/3/action/package_search
        title: Volltextsuche ueber alle Datensaetze (Parameter q=<begriff>)
        method: GET

  # =====================================================================
  # Umwelt und Klima
  # =====================================================================
  - id: uba_luftqualitaet
    label: Luftqualitaet (Umweltbundesamt)
    provider: Umweltbundesamt (UBA)
    protocol: rest
    base_url: https://luftdaten.umweltbundesamt.de/api/air-data/v3
    spec_url: https://luftdaten.umweltbundesamt.de/api/air-data/v3/doc
    spec_type: documentation
    license: Datenlizenz Deutschland Namensnennung 2.0
    documentation_url: https://www.umweltbundesamt.de/daten/luft/luftdaten
    verified: 2026-10
    data_type: table
    description: >-
      Messwerte und Messstationen des deutschen Luftmessnetzes (NO2, PM10,
      Ozon). Die Stationsliste traegt Koordinaten, ist also per
      Tabellen-Konnektor (FA14, x/y-Spalten) direkt als Punkt-Layer
      nutzbar - Messwerte kommen per attribute_join (FA34) an die
      Stationen.
    endpoints:
      - name: /stations/json
        title: Messstationen inkl. Koordinaten
        method: GET
        attributes: [station id, station code, station name, station longitude, station latitude, network code, station setting name]
        notes: >-
          JSON mit 'indices' (Spaltennamen, oben) und 'data' (je Station
          ein Array in dieser Reihenfolge) - kein flaches Tabellenformat.
      - name: /measures/json
        title: Messwerte je Station und Zeitraum
        method: GET
        attributes: [station, component, scope, date_from, date_to]

  - id: dwd_opendata
    label: DWD Open Data (Wetter und Klima)
    provider: Deutscher Wetterdienst (DWD)
    protocol: rest
    base_url: https://opendata.dwd.de
    spec_url: https://opendata.dwd.de/climate_environment/CDC/Readme_intro_CDC_ftp.pdf
    spec_type: documentation
    license: GeoNutzV (Namensnennung)
    documentation_url: https://www.dwd.de/DE/leistungen/opendata/opendata.html
    verified: 2026-09
    data_type: table
    description: >-
      Klima- und Wetterdaten als offener Dateibaum (kein klassisches
      REST-API, sondern ein durchsuchbares Verzeichnis).

      Die Stationsbeschreibung unten ist eine Datei mit FESTER
      SPALTENBREITE (Spalten durch Ausrichtung getrennt; ein Trennzeichen
      gibt es NICHT - Kopfzeile einfach-, Datenzeilen
      mehrfach-leerzeichengetrennt, dazu eine '---'-Linealzeile, deren
      Breiten nicht zu den Datenzeilen passen). Sie wird daher mit
      'format: fwf' und expliziten Spaltengrenzen eingebunden (FA39), die
      URL direkt als 'path' (FA38). Das example_layer unten ist genau so
      gegen die echte Datei geprueft (09/2026: 1386 Stationen). Niemals
      ein delimiter dafuer konstruieren - Stationsnamen enthalten
      Leerzeichen.
    endpoints:
      - name: /climate_environment/CDC/observations_germany/climate/daily/kl/recent/
        title: Taegliche Klimawerte (Stationsdateien)
        method: GET
      - name: /climate_environment/CDC/help/KL_Tageswerte_Beschreibung_Stationen.txt
        title: Stationsbeschreibung inkl. Koordinaten (feste Spaltenbreite)
        method: GET
        attributes: [Stations_id, von_datum, bis_datum, Stationshoehe, geoBreite, geoLaenge, Stationsname, Bundesland]
        notes: >-
          Feste Spaltenbreite, kein Trennzeichen. Die Spaltengrenzen im
          example_layer unten sind gegen die echte Datei geprueft
          (1386 Stationen, Stand 09/2026) - unveraendert uebernehmen.
    example_layer:
      id: dwd_stationen
      source: table
      path: https://opendata.dwd.de/climate_environment/CDC/help/KL_Tageswerte_Beschreibung_Stationen.txt
      format: fwf
      encoding: latin-1
      skiprows: 2
      colspecs: [[0, 5], [6, 14], [15, 23], [24, 38], [38, 50], [50, 60], [61, 101], [102, 142]]
      names: [Stations_id, von_datum, bis_datum, Stationshoehe, geoBreite, geoLaenge, Stationsname, Bundesland]
      geometry:
        x_column: geoLaenge
        y_column: geoBreite
        crs: EPSG:4326
      data_type: vector

  - id: esa_worldcover
    label: Landbedeckung 10 m (ESA WorldCover 2021)
    provider: Europaeische Weltraumorganisation (ESA)
    protocol: rest
    base_url: https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map
    license: CC BY 4.0 (Quellenangabe "© ESA WorldCover project 2021 / Contains modified Copernicus Sentinel data (2021) processed by ESA WorldCover consortium")
    documentation_url: https://esa-worldcover.org/en/data-access
    verified: 2026-10
    data_type: raster
    description: >-
      Weltweite Landbedeckung in 10-m-Zellen als Klassenraster (ein Band,
      EPSG:4326), ohne Anmeldung. KEINE Tabelle: die Kachel-URL kommt als
      'path' in einen file-Layer mit data_type: raster. Gelesen wird nur
      das Fenster der Szenario-Region, nicht die ganze Kachel (rund 76 MB).
      Klassenwerte: 10 = Baeume, 20 = Strauecher, 30 = Grasland, 40 =
      Ackerland, 50 = bebaut, 60 = vegetationsarm, 80 = Wasser, 90 =
      Feuchtgebiet. Der Anteil einer Klasse je Flaeche ist zonal_stats mit
      stat: share und class_value: <Klassenwert>.
    endpoints:
      - name: /ESA_WorldCover_10m_2021_v200_N51E012_Map.tif
        title: Kachel 51-54 Grad Nord, 12-15 Grad Ost (Leipzig, Nordsachsen, Berlin, Brandenburg)
        method: GET
      - name: /ESA_WorldCover_10m_2021_v200_N48E012_Map.tif
        title: Kachel 48-51 Grad Nord, 12-15 Grad Ost (Chemnitz, Dresden bis 51 Grad Nord, Erzgebirge, Ostbayern)
        method: GET
      - name: /ESA_WorldCover_10m_2021_v200_N51E009_Map.tif
        title: Kachel 51-54 Grad Nord, 9-12 Grad Ost (Niedersachsen, Sachsen-Anhalt, Hamburg)
        method: GET
      - name: /ESA_WorldCover_10m_2021_v200_N48E009_Map.tif
        title: Kachel 48-51 Grad Nord, 9-12 Grad Ost (Thueringen Sued, Franken, Stuttgart)
        method: GET
    notes: >-
      Kacheln sind 3 x 3 Grad gross und nach ihrer SUEDWESTLICHEN Ecke
      benannt (N48E012 = 48-51 Grad Nord, 12-15 Grad Ost; Breite und Laenge
      in Dreierschritten). Eine Region, die ueber eine Kachelgrenze reicht
      (der 51. Breitengrad verlaeuft durch Sachsen, Dresden liegt knapp
      noerdlich davon), braucht je Kachel einen eigenen Layer; Zonen
      ausserhalb der gewaehlten Kachel bekommen keinen Wert und werden als
      Warnung gemeldet.
    example_layer:
      id: landbedeckung
      source: file
      path: https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N51E012_Map.tif
      format: tif
      data_type: raster
      license:
        name: CC-BY-4.0
        attribution: "© ESA WorldCover project 2021 / Contains modified Copernicus Sentinel data (2021) processed by ESA WorldCover consortium"
        url: "https://creativecommons.org/licenses/by/4.0/"
